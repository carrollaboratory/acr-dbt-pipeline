anvil_duckdb:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '/home/rstudio/pipelines/data/acr_dbt_pipeline.duckdb') }}"
      schema: main
      threads: 4
      extensions:
        - name: bigquery
          repo: community

      # One read-only catalog per TDR snapshot, which is what lets the
      # snapshots live in different GCP projects. Each attachment is scoped to
      # one physical dataset because TDR identities may read an approved
      # dataset without permission to enumerate every dataset in its project.
      # dbt renders profiles.yml one value at a time, so keep exactly the
      # snapshots you can actually read uncommented here. Every env_var below
      # must resolve and every
      # ATTACH runs at connection time, so leaving a block enabled for a
      # snapshot you lack access to breaks every model, including the ones you
      # can read. The active GRU block has a known-project fallback so
      # `dbt parse` works before workspace variables are loaded. The
      # on-run-start check still requires explicit project, dataset, and
      # snapshot-ID variables before `dbt run`.
      #
      # To turn a snapshot on:
      #   1. add its three TDR_* values to the workspace .env
      #   2. set its TDR_<NAME>_ENABLED variable to true
      #   3. uncomment its attach block below
      attach:
        - path: "project={{ env_var('TDR_CMG_YALE_GRU_BQ_PROJECT', 'datarepo-2b98851b') }} dataset={{ env_var('TDR_CMG_YALE_GRU_BQ_DATASET', 'ANVIL_CMG_Yale_GRU_20221020_ANV5_202507091800') }}"
          alias: cmg_yale_gru_bq
          type: bigquery
          read_only: true

        # - path: "project={{ env_var('TDR_CMG_YALE_DS_BPEAKD_BQ_PROJECT') }} dataset={{ env_var('TDR_CMG_YALE_DS_BPEAKD_BQ_DATASET') }}"
        #   alias: cmg_yale_ds_bpeakd_bq
        #   type: bigquery
        #   read_only: true

        # - path: "project={{ env_var('TDR_CMG_YALE_DS_MC_BQ_PROJECT') }} dataset={{ env_var('TDR_CMG_YALE_DS_MC_BQ_DATASET') }}"
        #   alias: cmg_yale_ds_mc_bq
