version: 2

models:
  - name: cmg_int_concepts
    description: >-
      Unified concept table. model_enums is the authoritative source for
      concepts declared by the access model; tt_concepts supplies other
      extracted ontology concepts. Model-enum display and definition metadata
      take precedence. Explicit hardcoded defaults absent from both sources
      have identifier-only rows with NULL metadata. Concept URIs are constructed
      from unambiguous vocabulary templates; concept_uri_or_curie uses the
      CURIE when no usable template is available.
    columns:
      - name: concept_curie
        description: Canonical CURIE key for metadata joins and CURIE-restricted STB references.
        tests:
          - not_null
          - unique
          - curie_format
      - name: concept_uri
        description: Concept URI constructed from its vocabulary URI template, when available.
      - name: concept_uri_or_curie
        description: URI when the vocabulary URI template is known; otherwise the canonical CURIE.
      - name: display
        description: Model-enum title where supplied, otherwise its model display value.
      - name: definition
        description: Model-enum display value or term-trawler definition.

  - name: cmg_int_vocabulary
    description: >-
      Unified vocabulary metadata. Term Trawler values take precedence;
      vocabulary_details fills missing details and prefixes. A URI can be
      expanded only from a valid URI with a [code] template or an unambiguous
      base URI.
    columns:
      - name: vocabulary_prefix
        tests:
          - not_null
          - unique
      - name: concept_uri_template
        description: Expandable concept URI template, or NULL when no unambiguous template is known.

  - name: cmg_int_concept_metadata
    description: >-
      Early source-code lookup using the supplied term-trawler crosswalk and
      exact canonical Concept keys. Left joins the unified Concept and
      Vocabulary metadata without guessing or repairing source codes. Exact
      model-enum keys take precedence over crosswalk remappings; canonical keys
      absent from the crosswalk are included directly. When a crosswalk target
      is missing, an existing exact source key can still supply metadata.
    columns:
      - name: source_concept
        description: Exact source/mapping code or canonical CURIE used as a lookup key.
        tests:
          - not_null
          - unique
      - name: harmonized_curie
        description: Lookup key supplied by the crosswalk, not proof of a Concept match.
      - name: concept_curie
        description: Canonical Concept key from the unified concept table, or NULL if unmatched.
      - name: concept_display
        description: Model-enum or ontology display label, not the original MapDragon label.
      - name: concept_definition
        description: Model-enum or ontology definition.
      - name: concept_uri
        description: URI generated from the concept's vocabulary URI template, when available.
      - name: concept_uri_or_curie
        description: URI when available; otherwise the canonical Concept CURIE.
      - name: vocabulary_prefix
        description: Vocabulary key from the matched Concept.
      - name: fhir_system
        description: FHIR system from the matched Concept's Vocabulary.

  - name: cmg_int_mapdragon_annotations
    description: >-
      MapDragon rows enriched once with Concept and Vocabulary metadata.
      Original mapped_code, mapped_display, mapped_system, and source fields
      are preserved. Missing metadata stays NULL and does not remove mappings.

  - name: cmg_int_family_relationships
    description: >-
      Parent-to-child relationships resolved within a source snapshot.
      Keeps the original KIN relation_source and existing source-derived IDs.
      relation_concept_curie and related metadata are NULL when no Concept exists.
    columns:
      - name: relation_source
        description: Original intended KIN code, retained even without ontology metadata.
      - name: relation_concept_curie
        description: Matched canonical Concept key used by STB; NULL when unmatched.

  - name: cmg_int_anvil_dataset
    description: >-
      Dataset, consent, and stable identifiers with early DUO metadata links.
      Original permission/modifier code cells are retained. The corresponding
      concept_curie columns contain only unified Concept matches; composite
      modifier cells are not split or repaired.

  - name: cmg_int_subject
    description: >-
      Subject data with original field values and MapDragon mapped_code columns
      preserved. Field-specific concept_curie, concept_display,
      concept_definition, vocabulary_prefix, and fhir_system columns come from
      the shared metadata lookup. subject_type_source and organism_type_source
      preserve intended default codes separately from matched Concept values.

  - name: cmg_int_family
    description: >-
      Family data and source-derived identifiers with consanguinity and
      family-history mappings plus nullable ontology metadata. Original mapped
      codes are preserved separately from matched concept_curie columns.

  - name: cmg_int_sample
    description: >-
      Sample data and subject/study links with the original sample-source
      mapping and nullable sample_source concept and vocabulary metadata.

  - name: cmg_int_sequencing
    description: >-
      Sequencing data and sample/subject links with original analyte, assay,
      and equivalence-standard mappings plus nullable ontology metadata.
      The assay source text remains separate from its matched Concept key.

  - name: cmg_int_source_concepts
    description: >-
      Distinct source text/code inventory for vocabulary review. Delimited
      pairs are aligned by position, with unmatched partners retained as NULL.
      Dataset membership is aggregated into a list, avoiding rows per dataset.
      Configure the field dictionary in the model; this is not automatic
      ontology-field discovery or one row per subject. Original raw and
      normalized values remain unchanged; nullable Concept/Vocabulary metadata
      is joined on each normalized code token.
    columns:
      - name: table_ref
        description: Source table name without database or schema.
      - name: source_datasets
        description: >-
          Distinct sorted source_snapshot names where this raw cell pair occurs;
          NULL when no dataset column is configured for the source table.
      - name: raw_text
        description: Original full text cell, repeated for each split position.
      - name: raw_concept
        description: Original full code cell, repeated for each split position.
      - name: normalized_text
        description: Text token with whitespace normalized; NULL when absent or blank.
      - name: normalized_concept
        description: Code token after configured character removal and whitespace normalization.
      - name: text_column
        description: Name of the source label column; NULL for code-only fields.
      - name: concept_column
        description: Name of the source code column; NULL for text-only fields.
      - name: token_position
        description: Original 1-based position in the paired token lists.

  - name: cmg_int_mappings
    description: >-
      Distinct source concept/text links with source snapshot and field
      provenance, UWash split-text provenance, and matching MapDragon mappings.
      UWash split texts are separate text-only rows because their lookup has no
      token-position metadata. Source values without a matching mapping are
      retained with NULL mapping columns. Metadata lookup prefers the original
      MapDragon mapped_code, or the normalized source concept when no mapping
      code exists. It never substitutes source metadata for a bad mapped code.
    columns:
      - name: source_snapshot
        description: Source snapshot name that supplied the value.
      - name: source_snapshot_id
        description: TDR snapshot identifier for the source value.
      - name: source_site
        description: Site token parsed from the source snapshot name.
      - name: consent_group
        description: Consent group joined through the source snapshot.
      - name: source_datasets
        description: >-
          Sorted dataset names containing the original inventory text/code pair.
          On UWash split rows, this describes the unsplit input, not where the
          split mapping was applied. Use source_snapshot for that provenance.
      - name: source_relation
        description: Relation that supplied the source value.
      - name: source_column
        description: Source field being mapped, such as disease_description or hpo_absent.
      - name: text_column
        description: Text field in the source concept inventory, NULL for code-only values.
      - name: concept_column
        description: Code field in the source concept inventory, NULL for text-only values.
      - name: raw_text
        description: Full original text cell from the source data, if present.
      - name: normalized_text
        description: >-
          Tokenized source text or UWash split text with whitespace normalized,
          if present.
      - name: raw_concept
        description: >-
          Full original concept cell from the source data, if present; NULL on
          separate UWash split-text rows.
      - name: normalized_concept
        description: >-
          Tokenized source concept with whitespace normalized, if present; NULL
          on separate UWash split-text rows.
      - name: token_position
        description: >-
          Original 1-based position in source text/concept cells; NULL on
          separate UWash split-text rows.
      - name: uwash_original_text
        description: >-
          Original text key matched in the UWash split lookup, on separate
          text-only rows.
      - name: uwash_split_text
        description: >-
          Text from the UWash split lookup used for MapDragon matching on a
          separate text-only row; no positional concept pairing is inferred.
      - name: uwash_was_split
        description: >-
          Whether the UWash lookup split the original text, on separate
          text-only rows.
      - name: uwash_mapping_relation
        description: Relation that supplied the UWash text mapping, NULL when unmatched.
      - name: mapping_lookup_value
        description: Text or code value used to find the MapDragon mapping.
      - name: mapping_relation
        description: Mapping relation, NULL when no MapDragon record matched.
      - name: mapping_source_system
        description: MapDragon source_system used for the field-specific mapping.
      - name: mapping_source_text
        description: Source text/code in the matching MapDragon record.
      - name: mapped_code
        description: Mapped concept code from MapDragon.
      - name: mapped_display
        description: Display label for the mapped concept.
      - name: mapped_system
        description: Code system for the mapped concept.
      - name: mapping_table_id
        description: MapDragon table identifier for the matched mapping.
      - name: concept_lookup_source
        description: Original mapped code, or normalized source code when no mapped code exists.
      - name: concept_curie
        description: Matched canonical tt_concepts key; NULL when metadata is unavailable.
      - name: concept_display
        description: Display from the matched ontology Concept, not MapDragon.
      - name: concept_definition
        description: Definition from the matched ontology Concept.
      - name: fhir_system
        description: FHIR system from the matched Concept's Vocabulary.

  - name: cmg_int_subject_assertions
    description: >-
      Subject-level assertions keyed by subject, study, concept, and value
      concept when supplied. Unmapped concepts use normalized/raw source
      values for identity; repeated mapped assertions select a deterministic
      representative source text and mapping provenance. Leaves unknown
      asserter and source types NULL rather than inferring them. Concept and
      value-concept fields contain only matched tt_concepts keys; original
      codes remain in source/provenance fields. Identity continues to use the
      original mapping/source keys so metadata availability does not change IDs.
    columns:
      - name: assertion_id
        description: Stable disease or observation assertion identifier.
        tests:
          - not_null
          - unique
      - name: subject_id
        description: Global subject identifier from cmg_int_subject.
        tests:
          - not_null
      - name: source_column
        description: CMG source field that supplied the assertion.
      - name: concept_source
        description: Source text used to map the assertion concept, when available.
      - name: concept_curie
        description: Matched canonical Concept CURIE; NULL when ontology metadata is missing.
      - name: mapped_code
        description: Original MapDragon code, unchanged even when no metadata matches.
      - name: value_concept_source
        description: Original intended value code, retained whether or not its metadata exists.
      - name: value_concept_curie
        description: Matched value Concept CURIE; NULL when its metadata is missing.
