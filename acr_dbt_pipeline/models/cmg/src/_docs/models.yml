version: 2

models:
  - name: cmg_yale_src_gru_anvil_dataset
    description: >
      CMG Yale GRU anvil_dataset rows read from the local TDR Parquet export.
      Column names are aligned here; values are not cleaned until cmg_int_anvil_dataset.
    columns:
      - name: source_snapshot
        description: Logical TDR snapshot name from which the row was read.
        data_type: varchar
        data_tests:
          - not_null
      - name: source_snapshot_id
        description: UUID of the physical TDR snapshot from which the row was read.
        data_type: varchar
        data_tests:
          - not_null

  - name: cmg_uwash_src_gru_anvil_dataset
    description: >
      CMG UWash GRU anvil_dataset rows read from the local TDR Parquet export.
      Column names are aligned here; values are not cleaned until cmg_int_anvil_dataset.
    columns:
      - name: source_snapshot
        description: Logical TDR snapshot name from which the row was read.
        data_type: varchar
        data_tests:
          - not_null
      - name: source_snapshot_id
        description: UUID of the physical TDR snapshot from which the row was read.
        data_type: varchar
        data_tests:
          - not_null
