version: 2

sources:
  - name: cmg_yale_ds_bpeakd
    description: Raw CMG Yale DS-BPEAKD tables exposed by a TDR snapshot in BigQuery.
    database: "{{ var('tdr_snapshots')['cmg_yale_ds_bpeakd']['catalog'] }}"
    schema: "{{ env_var(var('tdr_snapshots')['cmg_yale_ds_bpeakd']['dataset_env_var']) }}"
    config:
      meta:
        snapshot_name: ANVIL_CMG_Yale_DS_BPEAKD
        snapshot_id_env_var: TDR_CMG_YALE_DS_BPEAKD_SNAPSHOT_ID
        project_env_var: TDR_CMG_YALE_DS_BPEAKD_BQ_PROJECT
        dataset_env_var: TDR_CMG_YALE_DS_BPEAKD_BQ_DATASET
    tables: &cmg_yale_tables
      - name: sample
        description: Raw sample records from the CMG Yale TDR snapshot.
      - name: subject
        description: Raw subject records from the CMG Yale TDR snapshot.
      - name: anvil_dataset
        description: Raw dataset and consent records from the CMG Yale TDR snapshot.
      - name: sequencing
        description: Raw sequencing records from the CMG Yale TDR snapshot.
      - name: family
        description: Raw family records from the CMG Yale TDR snapshot.
      - name: file_inventory
        description: Raw file inventory records from the CMG Yale TDR snapshot.

  - name: cmg_yale_ds_mc
    description: Raw CMG Yale DS-MC tables exposed by a TDR snapshot in BigQuery.
    database: "{{ var('tdr_snapshots')['cmg_yale_ds_mc']['catalog'] }}"
    schema: "{{ env_var(var('tdr_snapshots')['cmg_yale_ds_mc']['dataset_env_var']) }}"
    config:
      meta:
        snapshot_name: ANVIL_CMG_YALE_DS_MC
        snapshot_id_env_var: TDR_CMG_YALE_DS_MC_SNAPSHOT_ID
        project_env_var: TDR_CMG_YALE_DS_MC_BQ_PROJECT
        dataset_env_var: TDR_CMG_YALE_DS_MC_BQ_DATASET
    tables: *cmg_yale_tables

