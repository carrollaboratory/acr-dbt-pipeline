  # Use "<snapshot>.<table>", for example "cmg_uwash_gru_irb.workspace_attributes".
  disabled_src_tables:
    - cmg_yale_hmb.sequencing
    - cmg_yale_ds_mc.sequencing
    - cmg_yale_ds_rared.sequencing
    - cmg_broad_muscle_bonnemann_wes.sequencing

