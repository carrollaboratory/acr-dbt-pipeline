    - cmg_yale_gru
    - cmg_yale_hmb
    - cmg_yale_hmb_gso
    - cmg_yale_hmb_irb
    - cmg_yale_ds_mc
    - cmg_yale_ds_rd
    - cmg_yale_ds_rared
    - cmg_yale_ds_bpeakd
    - cmg_yale_ds_thal_irb
    - cmg_uwash_gru
    - cmg_uwash_gru_irb
    - cmg_uwash_hmb
    - cmg_uwash_hmb_irb
    - cmg_uwash_ds_ep
    - cmg_uwash_ds_hfa
    - cmg_uwash_ds_bdis
