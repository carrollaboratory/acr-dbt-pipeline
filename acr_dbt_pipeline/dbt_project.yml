  # snapshots. Both filters use the metadata below and combine as an intersection.
  # consent values can be replaced with metadata consentCode values without
  # changing source model names. Example:
  #   site_filters: ["cmg_yale"]
  #   consent_filters: ["ds_rd"]
  site_filters: []
  consent_filters: []

  # Local directory containing the exported Parquet files.
  tdr_parquet_root: "/home/rstudio/pipelines/data"

