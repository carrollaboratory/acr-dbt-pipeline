version: 2

macros:
  - name: generate_schema_name
    description: |
      Originally sourced from dbt_pipeline_utils (schema_name_from_path),
      copied locally. dbt schema naming override: <target.schema>_<model
      folders minus the layer folder>, e.g. models/cmg/int/x.sql -> main_cmg.
      Used automatically by dbt; not called directly in model SQL.

  - name: generate_md5_global_id
    description: |
      Originally sourced from dbt_pipeline_utils (macros/identifiers/identifiers.sql).
      SQL expression for a locally minted global id:
        '<prefix>_' || md5(value|value|...)
      Each value is normalized first: trimmed, internal whitespace collapsed
      to one space, case kept, '|' escaped as '/|', NULL or blank as ''.
      Example:
        generate_md5_global_id(prefix='sa', descriptor=['sa.subject_id', 'sa.sample_id'])

  - name: generate_descriptor_for_analysis
    description: |
      Originally sourced from dbt_pipeline_utils (macros/identifiers/identifiers.sql).
      Analysis column showing exactly which normalized values were hashed
      into a global id: '<label|label>:<prefix>-[<value|value>]'.
      Pass the same prefix and descriptor list as generate_md5_global_id.
      Labels default to the column names; pass labels to override.
        -> 'subject_id|sample_id|consent_group:sa-[S1|X1|GRU]'
