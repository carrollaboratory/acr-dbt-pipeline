version: 2

unit_tests:
  - name: demographics_routes_ethnicity_without_changing_codes
    model: cmg_stb_demographics
    given:
      - input: ref('cmg_int_subject')
        rows:
          - {subject_id: '1', subject_gid: sb_1, ancestry_mapped_code: '2135-2'}
          - {subject_id: '2', subject_gid: sb_2, ancestry_mapped_code: 'CDCREC:2186-5'}
          - {subject_id: '3', subject_gid: sb_3, ancestry_mapped_code: '2106-3'}
          - {subject_id: '4', subject_gid: sb_4, ancestry_mapped_code: 'NA'}
          - {subject_id: '5', subject_gid: sb_5, ancestry_mapped_code: null}
          - {subject_id: null, subject_gid: sb_6, ancestry_mapped_code: '2135-2'}
    expect:
      rows:
        - {subject_id: sb_1, ethnicity: '2135-2'}
        - {subject_id: sb_2, ethnicity: 'CDCREC:2186-5'}
        - {subject_id: sb_3, ethnicity: null}
        - {subject_id: sb_4, ethnicity: null}
        - {subject_id: sb_5, ethnicity: null}

  - name: demographics_race_excludes_ethnicity_without_changing_codes
    model: cmg_stb_demographics_race
    given:
      - input: ref('cmg_int_subject')
        rows:
          - {subject_id: '1', subject_gid: sb_1, ancestry_mapped_code: '2135-2'}
          - {subject_id: '2', subject_gid: sb_2, ancestry_mapped_code: 'CDCREC:2186-5'}
          - {subject_id: '3', subject_gid: sb_3, ancestry_mapped_code: '2106-3'}
          - {subject_id: '4', subject_gid: sb_4, ancestry_mapped_code: 'NA'}
          - {subject_id: '5', subject_gid: sb_5, ancestry_mapped_code: null}
          - {subject_id: '6', subject_gid: sb_6, ancestry_mapped_code: 'SNOMED:261665006'}
          - {subject_id: null, subject_gid: sb_7, ancestry_mapped_code: '2106-3'}
    expect:
      rows:
        - {demographics_subject_id: sb_3, race_concept_curie: '2106-3'}
        - {demographics_subject_id: sb_4, race_concept_curie: 'NA'}
        - {demographics_subject_id: sb_6, race_concept_curie: 'SNOMED:261665006'}
